<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f29">
<title>Tiddarr</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<style>
  .login-page { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-card { width: 100%; max-width: 360px; }
  .login-card .logo { display: flex; justify-content: center; margin-bottom: 18px; font-size: 22px; }
  .login-card label { display: block; color: var(--muted); margin: 12px 0 4px; }
  .login-card input { width: 100%; }
  .login-card .btn { width: 100%; justify-content: center; margin-top: 18px; }
  .login-card .banner { margin: 12px 0 0; }
</style>
</head>
<body>
<div class="login-page">
  <form class="panel login-card" id="form">
    <div class="logo"><img src="/static/icon.svg" alt="" width="28" height="28"> Tiddarr</div>
    <p class="muted small" id="hint" hidden></p>
    <label for="user" id="userLabel"></label>
    <input type="text" id="user" autocomplete="username" autocapitalize="off" autofocus required>
    <label for="pass" id="passLabel"></label>
    <input type="password" id="pass" autocomplete="current-password" required>
    <div class="banner err" id="err" hidden></div>
    <button class="btn primary" id="submit"></button>
  </form>
</div>
<script>
const T = {
  en: { user: "Username", pass: "Password", login: "Log in", setup: "Create account", setup_hint: "No account exists yet. Create the first admin account.",
        wrong_login: "Wrong username or password.", password_too_short: "The password needs at least 6 characters.", invalid_username: "Please enter a username." },
  de: { user: "Benutzername", pass: "Passwort", login: "Anmelden", setup: "Konto anlegen", setup_hint: "Es gibt noch kein Konto. Lege das erste Admin-Konto an.",
        wrong_login: "Benutzername oder Passwort falsch.", password_too_short: "Das Passwort braucht mindestens 6 Zeichen.", invalid_username: "Bitte einen Benutzernamen eingeben." },
};
const lang = (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
const t = (k) => T[lang][k] || k;
document.documentElement.lang = lang;
try { const a = localStorage.getItem("accent"); if (a) document.documentElement.style.setProperty("--accent", a); } catch { /* no storage */ }
const $ = (id) => document.getElementById(id);
$("userLabel").textContent = t("user");
$("passLabel").textContent = t("pass");
let setup = false;
fetch("/api/session").then((r) => r.json()).then((s) => {
  if (s.user) return location.replace("/");
  setup = s.setup;
  $("submit").textContent = t(setup ? "setup" : "login");
  if (setup) { $("hint").textContent = t("setup_hint"); $("hint").hidden = false; $("pass").autocomplete = "new-password"; }
});
$("submit").textContent = t("login");
$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("err").hidden = true;
  const res = await fetch(setup ? "/api/session/setup" : "/api/session", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("user").value, password: $("pass").value }),
  });
  if (res.ok) return location.replace("/" + (location.hash || ""));
  let msg = res.statusText;
  try { msg = t((await res.json()).error); } catch { /* not json */ }
  $("err").textContent = msg;
  $("err").hidden = false;
  $("pass").select();
};
</script>
</body>
</html>
